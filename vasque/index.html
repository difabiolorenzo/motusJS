<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation de vasque avec Matter.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 3px;
            font-size: 18px;
            z-index: 100;
            pointer-events: none;
        }
        
        button {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 12px 24px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
            background: #45a049;
        }
        
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <div id="info-panel">
        Aucune boule sélectionnée
    </div>
    <button onclick="appliquerForceExterne(balls, 0.33)">🌀 Secouer la vasque</button>

    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
    <script src="./vasque.js"></script>
</body>

</html>
